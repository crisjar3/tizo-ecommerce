openapi: 3.1.0
info:
  title: Tizo Ecommerce API
  version: 0.1.0
  description: Contrato consumido por Angular y simulado por MSW.
servers:
  - url: /api
paths:
  /catalog/products:
    get:
      operationId: listProducts
      responses:
        '200':
          description: Catálogo disponible
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
  /catalog/products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/cart:
    get:
      operationId: getCart
      responses:
        '200':
          description: Carrito actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /me/cart/items/{productId}:
    put:
      operationId: setCartItemQuantity
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: removeCartItem
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /me/orders:
    get:
      operationId: listCustomerOrders
      responses:
        '200':
          description: Pedidos proyectados para cliente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerOrder' }
    post:
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, format: uuid }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrder' }
        '200':
          description: Resultado idempotente original
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrder' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/orders/{orderId}:
    get:
      operationId: getCustomerOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido proyectado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderId}/cancellation-requests:
    post:
      operationId: createCustomerCancellation
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCancellation' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /ops/operators:
    get:
      operationId: listOperators
      responses:
        '200':
          description: Operadores demo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Operator' }
  /ops/orders:
    get:
      operationId: listOpsOrders
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: cancellation, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Página operacional
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OpsOrder' }
                  page: { type: integer }
                  total: { type: integer }
  /ops/orders/{orderId}:
    get:
      operationId: getOpsOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido con estados internos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ops/cancellation-requests:
    get:
      operationId: listCancellationRequests
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Solicitudes y vigencia actual
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CancellationRequest' }
    post:
      operationId: createOpsCancellation
      parameters:
        - $ref: '#/components/parameters/OperatorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCancellation' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '200':
          description: Resultado idempotente original
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /ops/cancellation-requests/by-idempotency-key/{key}:
    get:
      operationId: findCancellationByIdempotencyKey
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resultado reconciliado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ops/cancellation-requests/{requestId}:
    get:
      operationId: getCancellationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ops/cancellation-requests/{requestId}/approve:
    post:
      operationId: approveCancellationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperatorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveCancellation' }
      responses:
        '200':
          description: Solicitud completada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ops/cancellation-requests/{requestId}/reject:
    post:
      operationId: rejectCancellationRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperatorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ResolveCancellation'
                - type: object
                  required: [rejectionCode]
                  properties:
                    rejectionCode: { type: string }
                    rejectionNote: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Solicitud rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ops/cancellation-history:
    get:
      operationId: listCancellationHistory
      responses:
        '200':
          description: Auditoría de cancelaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    OperatorHeader:
      name: X-Operator-Id
      in: header
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Regla de dominio o concurrencia
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Product:
      type: object
      required: [id, name, sku, store, price, stock, category, imageUrl]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        sku: { type: string }
        store: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        stock: { type: integer, minimum: 0 }
        category: { type: string }
        imageUrl: { type: string }
    Cart:
      type: object
      required: [items, itemCount, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [product, quantity, lineTotal]
            properties:
              product: { $ref: '#/components/schemas/Product' }
              quantity: { type: integer, minimum: 1 }
              lineTotal: { $ref: '#/components/schemas/Money' }
        itemCount: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
    CustomerOrder:
      type: object
      required: [id, createdAt, progress, items, paidTotal, cancelledTotal, activeTotal]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        progress: { type: string, enum: [CONFIRMED, PREPARING, IN_TRANSIT, DELIVERED, CANCELLED] }
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerOrderItem' }
        paidTotal: { $ref: '#/components/schemas/Money' }
        cancelledTotal: { $ref: '#/components/schemas/Money' }
        activeTotal: { $ref: '#/components/schemas/Money' }
    CustomerOrderItem:
      type: object
      required: [id, name, quantity, lineTotal, cancelled]
      properties:
        id: { type: string }
        name: { type: string }
        quantity: { type: integer }
        lineTotal: { $ref: '#/components/schemas/Money' }
        cancelled: { type: boolean }
        refundStatus: { type: string, enum: [NONE, PENDING, SUCCEEDED, MANUAL_REVIEW] }
    OpsOrder:
      allOf:
        - $ref: '#/components/schemas/CustomerOrder'
        - type: object
          required: [customerName, fulfillmentStatus, cancellationStatus, version]
          properties:
            customerName: { type: string }
            fulfillmentStatus: { type: string }
            cancellationStatus: { type: string }
            version: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/OpsOrderItem' }
    OpsOrderItem:
      allOf:
        - $ref: '#/components/schemas/CustomerOrderItem'
        - type: object
          required: [sku, store, status, cancellable, operationalEffect]
          properties:
            sku: { type: string }
            store: { type: string }
            status: { type: string }
            cancellable: { type: boolean }
            operationalEffect: { type: string }
    CreateCancellation:
      type: object
      required: [orderId, itemIds, reasonCode, idempotencyKey]
      properties:
        orderId: { type: string }
        itemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        reasonCode: { type: string }
        reasonNote: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, format: uuid }
    ResolveCancellation:
      type: object
      required: [idempotencyKey, expectedVersion]
      properties:
        idempotencyKey: { type: string, format: uuid }
        expectedVersion: { type: integer }
    CancellationRequest:
      type: object
      required: [id, orderId, itemIds, status, reasonCode, requestedAt, requesterName, version, validNow]
      properties:
        id: { type: string }
        orderId: { type: string }
        itemIds:
          type: array
          items: { type: string }
        status: { type: string, enum: [REQUESTED, APPROVED, COMPLETED, REJECTED] }
        reasonCode: { type: string }
        reasonNote: { type: string }
        requestedAt: { type: string, format: date-time }
        requesterName: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolverName: { type: string }
        rejectionCode: { type: string }
        rejectionNote: { type: string }
        effectiveOrderId: { type: string }
        affectedAmount: { $ref: '#/components/schemas/Money' }
        version: { type: integer }
        validNow: { type: boolean }
        invalidReason: { type: string }
    Operator:
      type: object
      required: [id, name, initials, team, online]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        team: { type: string }
        online: { type: boolean }
    AuditEvent:
      type: object
      required: [id, entityId, action, actorName, occurredAt, correlationId]
      properties:
        id: { type: string }
        entityId: { type: string }
        action: { type: string }
        actorName: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        summary: { type: string }
    ApiError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
